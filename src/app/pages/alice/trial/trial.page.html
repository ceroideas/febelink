<ion-header>
  <ion-toolbar color="light">

    <ion-buttons slot="start">
      <ion-button (click)="home()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-row>
      <ion-title>Testing Alice Onboarding</ion-title>
  
      <app-lang-btn></app-lang-btn>
    </ion-row>

    <ion-buttons slot="end">
      <ion-button (click)="restart()">
        <ion-icon slot="icon-only" name="log-out"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!--
    Fill Fields
  -->
  <ion-grid *ngIf="!creating && !done">

    <ion-row>
      <ion-col size="3">
        <ion-item class="input" >
          <ion-label position="floating">Email</ion-label>
          <ion-input 
            type="email"
            clearInput
            (ionInput)="onEmail( $event.target.value )">
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <!-- Loading. -->
    <div class="cargando-container" margin-top *ngIf="isLoading">
      <ion-spinner></ion-spinner>
      <p>{{ 'common.labelLoading' | translate }}</p>
    </div>

    <!-- Search engine. -->
    <div class="content-filter" *ngIf="!isLoading">
      <div class="autocomplete">
        <ion-searchbar
          placeholder="{{ 'common.searchPlaceholder' | translate }}"
          [(ngModel)]="searchText"
          (ionFocus)="addFocus()"
          (ionChange)="search()"
          (ionBlur)="removeFocus()"
          (ionClear)="clearBtn()"
          (keyup.enter)="detectKeyPressed($event)"
          debounce="500"
        >
        </ion-searchbar>

        <div class="keys-dropdown">
          <ion-list
            mode="ios"
            *ngIf="searchText.length > 2 && keys.length > 0"
          >
            <ion-item
              (click)="countrySelected(key)"
              *ngFor="let key of keys"
              style="font-size: 16px"
            >
              <ion-icon slot="start" name="search-outline"></ion-icon>
              <span [innerHTML]="key.name"></span>
            </ion-item>
          </ion-list>
        </div>
      </div>
    </div>
    
  </ion-grid>

  <!--
    Fill Fields
  -->
  <ion-grid *ngIf="!creating && !done">
  
    <!-- Doc Types -->
    <ion-row>
      <!-- ID -->
      <ion-col size="2">
        <ion-item class="input" >
          <ion-label position="floating">ID</ion-label>
          <ion-checkbox [(ngModel)]="type_id" color="primary" (ionChange)="onChecked( $event.target.checked, 'id' )"></ion-checkbox>
        </ion-item>
      </ion-col>
  
      <!-- PASSPORT -->
      <ion-col size="2">
        <ion-item class="input" >
          <ion-label position="floating">Pasaporte</ion-label>
          <ion-checkbox [(ngModel)]="type_passport" color="secondary" (ionChange)="onChecked( $event.target.checked, 'passport' )"></ion-checkbox>
        </ion-item>
      </ion-col>
  
      <!-- RESIDENCE -->
      <ion-col size="3">
        <ion-item class="input" >
          <ion-label position="floating">Permiso de Residencia</ion-label>
          <ion-checkbox [(ngModel)]="type_residence" color="danger" (ionChange)="onChecked( $event.target.checked, 'residence' )"></ion-checkbox>
        </ion-item>
      </ion-col>
  
      <!-- DRIVER LICENSE -->
      <ion-col size="3">
        <ion-item class="input" >
          <ion-label position="floating">Licencia de Conducir</ion-label>
          <ion-checkbox [(ngModel)]="type_driver" color="dark" (ionChange)="onChecked( $event.target.checked, 'driver' )"></ion-checkbox>
        </ion-item>
      </ion-col>
  
      <!-- SELFIE -->
      <ion-col size="2">
        <ion-item class="input" >
          <ion-label position="floating">Selfie</ion-label>
          <ion-checkbox [(ngModel)]="selfie" color="primary" (ionChange)="onChecked( $event.target.checked, 'selfie' )"></ion-checkbox>
        </ion-item>
      </ion-col>
    </ion-row>
    
  
    <!-- Inputs -->
    <ion-row>
      <ion-col size="3">
        <ion-item class="input" >
          <ion-label position="floating">Email</ion-label>
          <ion-input 
            type="email"
            clearInput
            (ionInput)="onEmail( $event.target.value )">
          </ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="3">
        <ion-item class="input" >
          <ion-button (click)="onCreate()">Crear Usuario</ion-button>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>
  

  <!--
    Alice Onboarding
  -->
  <div id="demo-onboarding" *ngIf="creating && !done">
    <div id="alice-onboarding-mount"></div>
  </div>


  <!--
    KYC finished - Info Returned
  -->
  <ion-grid *ngIf="done">
    <!-- Info Basica -->
      <ion-row>
        <ion-col size="12">
          <ion-item class="input" >
            <ion-label>Info Básica ---------------------</ion-label>
          </ion-item>
        </ion-col>
      </ion-row>

  </ion-grid>

</ion-content>
