
<ion-header>
  <ion-toolbar color="febelink">
    <ion-title>RESPONDER OFERTA</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
<div class="apartado">
  <h2 class="title">{{oferta?.nombre}} <span class="reviews">
      <strong>{{oferta?.precio}}€</strong>
    </span></h2>
  <p class="desc">
    {{oferta?.descripcion}}
  </p>
</div>

<hr>

<ion-button class="apartado btn-info" (click)="irAPerfil()">
  <ion-icon name="person" item-left></ion-icon>
  &nbsp;VER OFERTANTE
</ion-button>

<hr>
  <ion-button class="apartado btn-info" (click)="viewChat()">
    <ion-icon style="color:white;" name="chatbox-ellipses-outline"></ion-icon>&nbsp;Chat
  </ion-button>
<div text-center *ngIf="oferta?.estado == 3" class="center_input_button">

  <ion-button class="btn-respuesta" (click)="responderOferta(1)">
    <ion-icon name="checkmark"></ion-icon>Aceptar
  </ion-button>
  <ion-button class="btn-respuesta" (click)="responderOferta(0)">
    <ion-icon name="checkmark"></ion-icon>Rechazar
  </ion-button>
</div>
</ion-content>
