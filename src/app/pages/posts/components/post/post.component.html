<div class="marg-se marg-b30 pad-tb-1 w-max-600 shadow-light">
  <ion-grid class="box-bw-r1-lln marg-5 no-padding">
    <ion-row class="marg-s10 marg-e10">
      <ion-col size="10" class="no-padding">
        <!-- Post Owner User -->
        <app-user-item
          class="no-padding"
          [id]="iAdvise?.uid"
          [user]="iAdvise"
          [subtitle]="iAdvise?.created_at | dateFormat: dateFormatType.DateTime"
          [OnClickShowProfile]="true"
        ></app-user-item>
      </ion-col>
  
      <ion-col size="2" class="no-padding">
        <!-- Post Language -->
        <ion-row class="align-end" *ngIf="showLang">
          <app-lang-btn [langIdSelected]="iAdvise?.lang" [disabled]="true"></app-lang-btn>
        </ion-row>
        
        <!-- Options Menu -->
        <ion-row class="align-end" *ngIf="showOpts">
          <ion-button icon-only color="transparent"
            class="no-padding no-shadow no-margin"
            (click)="options( $event )"
          >
            <ion-icon class="font-30" src="assets/icon/svg/options.svg"></ion-icon>
          </ion-button>
        </ion-row>
  
        <ion-row class="align-end">
          <!-- If has Edited The Post -->
          <ion-label class="hint font-13" *ngIf="iAdvise.created_at != iAdvise.updated_at">
            {{ 'common.labelEdited' | translate }}
          </ion-label>
        </ion-row>
      </ion-col>
    </ion-row>
  
    <!-- Sector > Subsector -->
    <ion-row class="marg-s10 marg-e10">
      <ion-label color="febelink" class="font-14">{{ iAdvise.sector }}</ion-label>
      <ion-label color="febelink" class="font-14 marg-s10 marg-e10" *ngIf="iAdvise.subsector" >></ion-label>
      <ion-label color="febelink" class="font-14" *ngIf="iAdvise.subsector">{{ iAdvise.subsector }}</ion-label>
    </ion-row>
  
    <!-- Title -->
    <ion-row class="one-line marg-t5 marg-s10 marg-e10">
      <h1 class="no-margin bold-6 font-18 title" [innerHTML]="extractTitle()"></h1>
    </ion-row>
  
    <!-- Subitle -->
    <ion-row class="one-line marg-t5 marg-s10 marg-e10" *ngIf="iAdvise.subtitle">
      <h3 class="no-margin font-16 subtitle" [innerHTML]="iAdvise.subtitle"></h3>
    </ion-row>
  
    <!-- Summary -->
    <ion-row class="lines-2 marg-t5 marg-s10 marg-e10 inline" *ngIf="iAdvise.summary || !showContent">
      <ion-label
        [class]="'summary ' + ( !iAdvise?.subtitle ? '' : 'hint' )"
        [innerHTML]="extractSummary()"
      ></ion-label>
    </ion-row>
  
    <!-- Image -->
    <ion-row class="marg-t10" *ngIf="iAdvise.photo && isPostVisible">
      <ion-img class="photo" [src]="iAdvise.photo"></ion-img>
    </ion-row>
  
    <!-- Content -->
    <ion-row class="marg-10 content" *ngIf="showContent && isPostVisible">
      <ion-label [innerHTML]="iAdvise.content"></ion-label>
    </ion-row>
    
    <app-post-bottom-bar-component  *ngIf="isPostVisible"
      [id]="id"
      [post]="iAdvise"
      [showSeePost]="showSeePost"
    ></app-post-bottom-bar-component>

    <!-- Set Post Visible -->
    <ion-row class="align-center" *ngIf="!isPostVisible">
      <em class="pointer font-12" (click)="isPostVisible = true; areCommentsVisible = false">
        <ion-label color="primary">{{ 'Show Post' | translate }}</ion-label>
      </em>
    </ion-row>
  </ion-grid>

  <app-comments-component #comments
    [post]="id"
    [listComments]="listComments"
    [isVisible]="areCommentsVisible"
    (OnCommentsVisible)="isPostVisible = false"
  ></app-comments-component>
</div>
