<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>

    <ion-title
      >{{ 'pages.posts.advises.' + ( id ? 'edit' : 'create.title' ) | translate
      }}</ion-title
    >

    <!-- Lang -->
    <ion-buttons slot="end">
      <app-lang-btn #lang [changeAppLang]="false"></app-lang-btn>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Loading -->
  <app-loading
    [isLoading]="isLoading"
    clase="marg-t10"
    message="common.labelSearching"
  ></app-loading>

  <!-- Form -->
  <form [formGroup]="form" class="no-pad" *ngIf="!isLoading && form">
    <ion-grid class="no-pad pad-t10">
      <!-- Topic -->
      <ion-row class="col-flexed pad-5">
        <ion-label> {{ 'common.labelTopic' | translate }} </ion-label>
        <ion-select
          interface="popover"
          formControlName="topic"
          [(ngModel)]="topicSelected"
        >
          <ion-select-option *ngFor="let topic of topics" [value]="topic.id">
            {{ topic.name }}
          </ion-select-option>
        </ion-select>
      </ion-row>

      <!-- Title -->
      <ion-row class="pad-5" *ngIf="false">
        <ion-input
          class="box-bw-r1-lln font-20"
          type="text"
          formControlName="title"
          [placeholder]="'pages.posts.advises.create.title' | translate"
          maxlength="50"
        ></ion-input>
      </ion-row>

      <!-- Subtitle -->
      <ion-row class="marg-t10 pad-5" *ngIf="false">
        <ion-input
          class="box-bw-r1-lln font-16"
          type="text"
          formControlName="subtitle"
          [placeholder]="'pages.posts.advises.create.subtitle' | translate"
          maxlength="70"
        ></ion-input>
      </ion-row>

      <!-- Summary -->
      <ion-row class="marg-t10 pad-5" *ngIf="false">
        <ion-textarea
          class="hint box-bw-r1-lln"
          type="text"
          formControlName="summary"
          [placeholder]="'pages.posts.advises.create.summary' | translate"
          maxlength="120"
        ></ion-textarea>
      </ion-row>

      <!-- Summary Referencing Post -->
      <ion-row class="marg-t10" *ngIf="id_reference">
        <!-- Loading -->
        <ion-spinner class="marg-se marg-b5" *ngIf="!reference"></ion-spinner>
        <!-- Remove Reference -->
        <ion-icon
          *ngIf="reference"
          name="close-circle-outline"
          color="primary"
          class="no-padding wh-30 shadow-light marg-t10 relativism pointer"
          (click)="id_reference = null; iAdvise.id_advise = null"
        ></ion-icon>
        <!-- Reference -->
        <app-post-summary-component
          *ngIf="reference"
          class="w-full"
          [id]="id_reference"
          [iAdvise]="reference"
          [watchOnClick]="false"
        ></app-post-summary-component>
      </ion-row>

      <!-- WYSIWYG -->
      <ion-row class="marg-t10 pad-5">
        <app-wysiwyg
          [html]="iAdvise?.content"
          [placeholder]="'pages.posts.advises.create.wysiwyg' | translate"
          (OnChange)="wysiwygChange( $event )"
          (OnImgClick)="pick.clicks()"
        ></app-wysiwyg>
      </ion-row>

      <!-- Image | Video -->
      <ion-row
        [class]="'marg-t10 marg-se wh-social-media media-pos' + ( iFile?.src ? '' : ' gone' )"
      >
        <!-- Remove Image -->
        <ion-button
          icon-only
          shape="round"
          class="no-padding wh-40 marg-t10 relativism"
          (click)="fileSelected( null )"
        >
          <ion-icon name="trash-outline" color="primary"></ion-icon>
        </ion-button>

        <!-- File Picker -->
        <app-file-picker
          #pick
          [iFile]="iFile"
          (OnFile)="fileSelected( $event )"
        ></app-file-picker>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>

<ion-footer no-border>
  <ion-toolbar class="tx-center">
    <!-- Cancel Button -->
    <ion-button class="marg-e10" (click)="goHome()">
      {{ 'common.buttons.cancel' | translate}}
    </ion-button>

    <!-- Share Advise | Post Button -->
    <ion-button class="marg-s10" (click)="shareAlert()">
      {{ 'pages.posts.advises.' + ( id ? 'editButton' : 'create.saveButton' ) |
      translate }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
