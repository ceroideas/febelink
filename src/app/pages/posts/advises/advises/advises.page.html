<ion-header>
  <ion-toolbar>
    <ion-grid>
      <ion-row>
        <!-- Searchbar -->
        <ion-searchbar #searchBar
          placeholder="{{ 'common.searchPlaceholder' | translate }}"
          inputmode="text"
          (keyup.enter)="search( searchBar.value )"
          (ionChange)="search( searchBar.value )"
          (ionClear)="search( searchBar.value )"
          debounce="500"
          [value]="searchTx"
        ></ion-searchbar>
        
        <ion-buttons slot="end">
          <!-- Icon - Filter -->
          <ion-button icon-only class="no-padding marg-s marg-e" (click)="showFilters = !showFilters">
            <ion-icon class="font-40" src="assets/icon/svg/filter.svg"></ion-icon>
          </ion-button>

          <!-- Icon - Add -->
          <ion-button icon-only class="no-padding marg-s marg-e" (click)="createPost()">
            <ion-icon class="font-40" src="assets/icon/svg/add.svg"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-row>

      <!-- Filters -->
      <ion-row [style]="'display: ' + ( showFilters ? 'block;' : 'none' )">
        <!-- Sectors -->
        <app-sectors #sectors></app-sectors>

        <!-- Language -->
        <ion-col size="12" size-sm="3">
          <ion-row>
            <ion-col size="6">{{ 'common.labelLang' | translate }}</ion-col>
            <ion-col size="6"><app-lang-btn #lang></app-lang-btn></ion-col>
          </ion-row>
        </ion-col>

        <!-- User -->
        <ion-col size="12" size-sm="3">
          <ion-row>
            <ion-col size="6">{{ 'common.labelLang' | translate }}</ion-col>
            <ion-col size="6"><app-user-item #user (onUserClick)="userClicked()"></app-user-item></ion-col>
          </ion-row>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Loading -->
  <app-loading [isLoading]="isLoading" message="common.labelSector"></app-loading>

  <!-- Posts -->
  <ng-container *ngIf="!isLoading">
    <app-post-advise *ngFor=""></app-post-advise>
  </ng-container>

  <!-- No Items -->
  <ion-label *ngIf="!isLoading && iAdvises?.length <= 0">
    {{ 'pages.post.advises.no-items' + ( hasFilters() ? '' : '-filters' ) | translate }}
  </ion-label>
</ion-content>

<ion-footer
  class="ion-no-border ion-text-center desktop"
  no-border
  color="transparent"
  *ngIf="pagination.qPages > 1"
>
  <ion-toolbar color="febelink">
    <!-- Pagination Bottom -->
    <app-pagination #pagination
      [disabled]="isLoading"
      (onPageChange)="displayActivePage()"
    >
  </app-pagination>
  </ion-toolbar>
</ion-footer>
