<div class="top-create-post">
  <div class="top-create-post-left">
    <div (click)="createPost()" class="top-create-post-left-inside">
      Comparte tus noticias y comentarios
    </div>
  </div>
  <div class="top-create-post-right">
    <img src="assets/icon/svg/filter-post.svg" (click)="showFilters = !showFilters" class="top-create-post-svg" />
  </div>
</div>

<ion-content class="padding-top pad-se">
  <!-- <h1>¡Bienvenido a la comunidad de Febelink!</h1> -->

  <!-- Loading -->
  <app-loading
    [isLoading]="isLoading"
    clase="marg-t10"
    message="common.labelSearching"
  ></app-loading>

  <ion-refresher
    slot="fixed"
    (ionRefresh)="clear2search( searchBar.value + '', $event )"
  >
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Posts -->
  <app-post-component
    *ngFor="let advise of iAdvises"
    [id]="advise.id"
    [iAdvise]="advise"
    [showLang]="true"
    [showSeePost]="true"
  ></app-post-component>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="triggerInfiniteSearch($event)">
    <ion-infinite-scroll-content
      loadingSpinner="lines-small"
      loadingText="Cargando más elementos...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>


  <!-- No Items -->
  <ion-item lines="none" color="transparent" *ngIf="finishedSearch">
    <ion-label
      class="marg-b30 tx-center hint pointer"
      (click)="createPost()"
      [innerHTML]="'pages.posts.advises.error.no-items' + ( !hasFilters() ? '' : '-filters' ) | translate"
    ></ion-label>
  </ion-item>
</ion-content>


<div *ngIf="showFilters" class="modal-back-background">
  <div class="filter-content-background">
    <div class="filter-content-padding">
      <div class="modal-front-title">
        Filtros
      </div>
      <div class="modal-add-name">
        {{ 'common.labelTopic' | translate }}
      </div>
      <div class="modal-input-div">
        <ion-item class="no-padding modal-add-price-select">
            <ionic-selectable class="price-select" placeholder="Tema"
            #topic
            item-content
            [(ngModel)]="topicSelected"
            itemValueField="id"
            itemTextField="name"
            [items]="topics"
          >
          </ionic-selectable>
        </ion-item>
      </div>
      <div class="modal-add-name">
        {{ 'common.labelLang' | translate }}
      </div>
      <div class="modal-input-div height-lang-button">
        <app-lang-btn
              #lang
              [changeAppLang]="false"
              [initNull]="true"
              [short]="false"
          ></app-lang-btn>
      </div>
      <div class="modal-add-name margin-bottom-title">
        Entradas del oráculo
      </div>
      <div class="div-filter-check">
        <ion-checkbox class="no-padding filter-check-a"
            size="12"
            size-sm="3"
            [(ngModel)]="!myPosts" (ngModelChange)="myPosts = !$event"
        ></ion-checkbox>
          Todas
      </div>
      <div class="div-filter-check-b">
        <ion-checkbox class="no-padding filter-check-a"
            #chkMyPosts
            size="12"
            size-sm="3"
            [(ngModel)]="myPosts"
        ></ion-checkbox>
          Solo mis post
      </div>
      
      <div *ngIf="!myPosts" class="modal-add-name margin-bottom-title">
        Búsqueda por usuario
      </div>

      <div *ngIf="!myPosts" class="filter-section-search" (click)="userClicked()">
        <div class="filter-section-img">
          <img src="assets/icon/svg/search-user.svg" class="filter-section-img-svg" />
        </div>
        <div *ngIf="!userNickSearch" class="filter-section-search-text">
          Buscar usuario
        </div>
        <div *ngIf="userNickSearch" class="filter-section-search-text">
          {{userNickSearch}}
        </div>
      </div>
    </div>
    
    <div class="filter-section-bottom">
      <div class="modal-button-primary-filter" (click)="clear2search();showFilters = !showFilters">
        Aplicar
      </div>
      <div class="modal-button-secondary-filter" (click)="showFilters = !showFilters">
        Cancelar
      </div>
    </div>
  </div>
</div>
