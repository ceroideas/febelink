<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/menu/todas"></ion-back-button>
    </ion-buttons>
    <ion-title>Registro de notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- {{notifications | json}} -->
  <ion-list *ngIf="notifications" class="results-list">

    <ion-item tappable lines="none"
    *ngFor="let notif of notifications"  [routerLink]="notif.route">

        <ion-icon slot="start" [name]="getIconByType(notif.type)"></ion-icon>

      <ion-label>
        <h2><strong>{{notif.title}}</strong></h2>
        <p>{{notif.message}}</p>
      </ion-label>
      <!-- <ion-button *ngIf="currentUser.id === offer?.id_demandante" fill="clear" (click)="editItem(offer); $event.stopPropagation();" class="editBtn">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
      <ion-button color="danger" fill="clear" (click)="deleteItem(offer); $event.stopPropagation();">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button> -->
    </ion-item>
  </ion-list>
</ion-content>
