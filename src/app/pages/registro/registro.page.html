<ion-content>
  <div class="cover-content">
    <img src="assets/imgs/logo.png" alt="logo" />
    <p class="title">Crear una cuenta gratuita</p>
    <form *ngIf="form" [formGroup]="form" (ngSubmit)="submitForm()">
      <ion-item class="input ion-no-padding">
        <ion-label>
          <ion-icon name="person"></ion-icon>
        </ion-label>
        <ion-input
          clearInput
          type="text"
          formControlName="name"
          placeholder="Nombre de usuario"
          required
        >
        </ion-input>
      </ion-item>
      <ion-item class="input ion-no-padding">
        <ion-label>
          <ion-icon name="person"></ion-icon>
        </ion-label>

        <ion-select clearInput placeholder="Sector" formControlName="sector">
          <ion-select-option
            [value]="sector?.id"
            *ngFor="let sector of sectores"
            >{{sector?.nombre}}</ion-select-option
          >
        </ion-select>
      </ion-item>
      <ion-item class="input ion-no-padding" *ngIf="subsectores?.length>0">
        <ion-label>
          <ion-icon name="person"></ion-icon>
        </ion-label>

        <ion-select
          clearInput
          placeholder="Subsector"
          formControlName="sub_sector"
        >
          <ion-select-option
            *ngFor="let subsector of subsectores"
            [value]="subsector?.id"
            >{{subsector?.nombre}}</ion-select-option
          >
        </ion-select>
      </ion-item>
      <ion-item class="input ion-no-padding">
        <ion-label>
          <ion-icon name="mail"></ion-icon>
        </ion-label>
        <ion-input
          clearInput
          type="email"
          formControlName="email"
          placeholder="Email"
          required
        ></ion-input>
      </ion-item>
      <ion-item class="input ion-no-padding">
        <ion-label>
          <ion-icon name="lock-closed"></ion-icon>
        </ion-label>
        <ion-icon
          slot="end"
          (click)="hideShowPassword()"
          [name]="passwordIcon"
          class="passwordIcon"
        ></ion-icon>
        <ion-input
          clearInput
          [type]="passwordType"
          formControlName="password"
          placeholder="Contraseña"
          required
        >
        </ion-input>
      </ion-item>
      <ion-item class="input ion-no-padding">
        <ion-label>
          <ion-icon name="lock-closed"></ion-icon>
        </ion-label>
        <ion-icon
          slot="end"
          (click)="hideShowPassword2()"
          [name]="passwordIcon2"
          class="passwordIcon"
        ></ion-icon>
        <ion-input
          clearInput
          [type]="passwordType2"
          formControlName="confirmPassword"
          placeholder="Confirmar contraseña"
          required
        ></ion-input>
      </ion-item>
     
      <span class="privacyConditions">
        <ion-checkbox slot="start" formControlName="privacyConditions"></ion-checkbox>
          He leído, y acepto la
          <a (click)="openPrivacyPolicy()">política de privacidad</a>
          y las 
          <a (click)="openUseConditions()">condiciones generales de uso</a>
      </span>

      <ion-button expand="full" type="submit" ion-button color="febelink"
        >REGISTRARSE</ion-button
      >
      <social-login firstLogin="true" [redirect]="redirect"></social-login>
    </form>
  </div>
  <div class="cover-overlay">
    <a href="mailto:info@febelink.com">Contacta con Febelink</a>
  </div>
</ion-content>
