<ion-header>
  <ion-toolbar color="febelink">
    <ion-icon
      (click)="goBack()"
      slot="start"
      name="arrow-back-outline"
    ></ion-icon>
    <ion-title class="ion-text-center">{{ 'pages.wallet.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="userWallets">
  <ion-grid>
    <ion-row>
      <ion-col size="4">
        <ion-label>{{ 'pages.wallet.public-key' | translate }}</ion-label>
      </ion-col>
      <ion-spinner *ngIf="!publicKey"></ion-spinner>
      <ng-container *ngIf="publicKey" tappable>
        <ion-col size="6">
          <ion-label (click)="copyPublicKey()" class="one-line" tappable>{{ publicKey }}</ion-label>
        </ion-col>
        <ion-col size="2">
          <ion-icon (click)="copyPublicKey()" name="clipboard"></ion-icon>
        </ion-col>
      </ng-container>
    </ion-row>
    <ion-row>
      <ion-col *ngFor="let currency of userWallets">
        <ion-card (click)="exchage( currency )">
          <ion-row class="vertical-content">
            <img src="assets/icon/{{currency.currency.toLowerCase()}}.png" />
            <ion-card-subtitle> {{currency.currency}}</ion-card-subtitle>
          </ion-row>
          <ion-card-subtitle> {{currency.ammount}}</ion-card-subtitle>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-item-divider></ion-item-divider>
    </ion-row>
    <ion-row class="margin-top">
      <ion-title>{{ 'pages.wallet.no-transactions' | translate }}</ion-title>
    </ion-row>
  </ion-grid>
</ion-content>
