<ion-content>
  <div class="container">
    <img class="logo" src="assets/landing/logo-dark.png">
    <h2>{{ info.title | translate }}</h2>
    <h4>{{ info.subtitle | translate }}</h4>
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    <div class="text" [innerHTML]="info.text | translate">
    </div>
    <div>
      <ion-button (click)="back()">{{ 'common.buttons.back' | translate }}</ion-button>
    </div>
  </div>
</ion-content>
