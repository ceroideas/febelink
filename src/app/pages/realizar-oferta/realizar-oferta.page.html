

<ion-header>
  <ion-toolbar color="febelink">
    <ion-title>Realizar Oferta</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <form *ngIf="form" [formGroup]="form" (ngSubmit)="submitForm()">
    <ion-item>
      <ion-label position="floating">
        Titulo
      </ion-label>
      <ion-input type="text" formControlName="nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">
        Precio <em>(En euros)</em>
      </ion-label>
      <ion-input type="number" formControlName="precio"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">
        Descripcion
      </ion-label>
      <ion-textarea rows="6" cols="20" formControlName="descripcion"></ion-textarea>
    </ion-item>
    <ion-button type="submit" class="enviar">Enviar oferta</ion-button>
  </form>
</ion-content>
