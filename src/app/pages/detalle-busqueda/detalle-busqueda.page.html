<ion-content *ngIf="detalle">
    <ion-grid size="12">
      <ion-row size="12" class="ion-margin parrafo_val">
        <ion-img src="assets/icon/svg/icon_casa.svg"></ion-img>
        <ion-breadcrumbs rel="-">
          <ion-breadcrumb href="/menu/todas">{{ 'menu.tabs.inicio' | translate }}</ion-breadcrumb>
          <ion-breadcrumb href="#">Servicio</ion-breadcrumb>
        </ion-breadcrumbs>
      </ion-row>
      <ion-row size="12">
        <ion-col size="10">
          <ion-text class="text_compartir">{{detalle.detalle?.nombre}}</ion-text>
        </ion-col>
        <ion-col size="2">
          <ion-img class="icon_compartir" src="assets/icon/svg/icon_compartir.svg"></ion-img>
        </ion-col>
      </ion-row>
      <ion-row class="row_val" size="12">
        <p class="ion-margin parrafo_val_bis"> 
          <ion-img class="icon_star" src="assets/icon/svg/icon_star.svg"></ion-img>
          <ion-img class="icon_star" src="assets/icon/svg/icon_star.svg"></ion-img>
          <ion-img class="icon_star" src="assets/icon/svg/icon_star.svg"></ion-img>
          <ion-img class="icon_star" src="assets/icon/svg/icon_star.svg"></ion-img>
          <ion-img class="icon_star" src="assets/icon/svg/icon_star.svg"></ion-img>
          ({{detalle.detalle?.valoracion}}) valoraciones
        </p>    
      </ion-row>
      <ion-row size="12">
      </ion-row>
    <div class="ion-margin parrafo_val">
      <swiper
      [spaceBetween]="10"
      [navigation]="true"
      [thumbs]="{ swiper: thumbsSwiper }">
        <ng-template swiperSlide>
          <ion-img src="./assets/imgs/bg0.jpg"></ion-img>
        </ng-template>
        <ng-template swiperSlide>
          <ion-img src="./assets/imgs/bg1.jpg"></ion-img>
        </ng-template>
        <ng-template swiperSlide>
          <ion-img src="./assets/imgs/bg2.jpg"></ion-img>
        </ng-template>
      </swiper>
      <swiper
      (swiper)="thumbsSwiper = $event"
      [spaceBetween]="10"
      [slidesPerView]="4"
      [freeMode]="true"
      [watchSlidesProgress]="true"
      class="mySwiper">
        <ng-template swiperSlide>
          <img class="tam_img" src="./assets/imgs/bg0.jpg"/>
        </ng-template>
        <ng-template swiperSlide>
          <img class="tam_img" src="./assets/imgs/bg1.jpg"/>
        </ng-template>
        <ng-template swiperSlide>
          <img class="tam_img" src="./assets/imgs/bg2.jpg"/>
        </ng-template>
    </swiper>
    </div> 
      <ion-row size="12" class="ion-margin parrafo_val">
        {{detalle.detalle?.descripcion}} <ion-text class="read_more">Leer más</ion-text>
      </ion-row>
      <ion-row class="ion-margin parrafo_val" size="12">
        <ion-col size="6">
          <ion-item class="item_cantidad">
            <ion-label class="ion-no-padding label_cantidad">Cantidad</ion-label>
          </ion-item>
          <ion-item class="item_cantidad_border">
            <ion-label>1</ion-label>
            <ion-select>
              <ion-select-option value="1" selected>1</ion-select-option>
              <ion-select-option value="2">2</ion-select-option>
              <ion-select-option value="3">3</ion-select-option>
              <ion-select-option value="4">4</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-row class="row_cantidad">
            <ion-label class="text_cantidad">{{detalle.detalle?.precio}},00€</ion-label>
          </ion-row>
        </ion-col>
      </ion-row>
    </ion-grid>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-grid fixed>
      <ion-row class="ion-padding paddingf1">
        <ion-button expand class="botonf1" type="submit">Comprar ahora</ion-button>
      </ion-row>
      <ion-row class="ion-padding paddingf2">
        <ion-button expand class="botonf2" type="submit">Añadir al carrito</ion-button>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
