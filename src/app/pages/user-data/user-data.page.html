<div class="container-layer">
  <div   class="layer-gradient"><div    class="eclipse"></div></div>
<div class="container-detail-profile">
  <div class="container">

    <h1 class="title">Datos Usuario	
    </h1>

    <div class="card-container">
      <div class="card">
        <div class="image-profile">
          <img src="https://api.febelink.com/storage/users/3857/perfil_65df5920671bd_1709136160.png"/>
        </div>
      </div>
      <div class="grid">
  
        
        <div class="form-group a">
          <label for="name">Usuario
          </label>
          <input id="name" type="text">
        </div>
        
  
      </div>
      <div class="grid">
        <div class="textarea-group">
          <label for="bio">Sobre mí</label>
          <textarea id="bio"></textarea>
        </div> 
      </div>
      <div class="grid">
  
        <div class="form-group email-group">
          <label for="email">Contraseña
          </label>
          <input id="email" type="text">
        </div>
  
        <div class="form-group phone-group">
          <label for="phone">Repetir Contraseña  </label>
          <input id="phone" type="text">
        </div>
      </div>
    </div>
  
    
    <div class="button-container">
      <button class="button">Enregister les modifications</button>
    </div>
  </div>

  <div class="container">

    <h1 class="title">Datos personales	
    </h1>

    <div class="grid">
      <div class="form-group a">
        <label for="name">Nombre y Apellidos
        </label>
        <input id="name" type="text">
      </div>

      <div class="form-group b">
        <label for="first-name">DNI/NIF/NIE/CIF
        </label>
        <input id="first-name" type="text">
      </div>

      <div class="form-group email-group">
        <label for="email">Nombre de la empresa
        </label>
        <input id="email" type="text">
      </div>

      <div class="form-group phone-group">
        <label for="phone">Dirección  </label>
        <input id="phone" type="text">
      </div>

      <div class="textarea-group">
        <label for="bio">Teléfono</label>
        <textarea id="bio"></textarea>
      </div>

      <div class="form-group">
        <label for="address">Número de cuenta</label>
        <input id="address" type="text">
      </div>

      <div class="form-group">
        <label for="city">Web</label>
        <input id="city" type="text">
      </div>

      <div class="form-group">
        <label for="zip">Idioma</label>
        <input id="zip" type="text">
      </div>
    </div>

    

    <div class="button-container">
      <button class="button">Enregister les modifications</button>
    </div>
  </div>
</div>
</div>
