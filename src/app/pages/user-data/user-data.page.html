<ion-header>
  <ion-toolbar class="header_buttons" color="header">
    <ion-buttons buttons-start slot="start">
      <ion-menu-button class="desktop_menu_avatar">
        <ion-img class="desktop_menu_avatar"
          id="menuImg"
          [src]="
            currentUser?.logo !== null
              ? currentUser?.logo
              : 'https://api.febelink.com/storage/users/default.png'
          "
          (error)="onImgError($event)"
          alt="Menu profile picture">
        </ion-img>
      </ion-menu-button>  
      <ion-img *ngIf="curUser" class="pos_menu" src="assets/icon/icon_header_menu.png"></ion-img>
      <ion-img *ngIf="curUser" class="mobile menu_header" src="assets/icon/svg/chat_header.svg"></ion-img>
    </ion-buttons>  
    <app-header-buttons class="buttons_flex" [perfil]="curUser" currentTab="6"></app-header-buttons>
    <ion-buttons buttons-start slot="end">
      <ion-img
      tappable 
      src="assets/imgs/logo.png" 
      alt="Febelink logo" 
      (click)="irA('/' + homePage)"
      class="ion-margin logo desktop"></ion-img> 
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-grid class="ion-no-padding" size="12">
    <ion-row size="12" class="row_grid">
      <ion-breadcrumbs mode="ios">
        <ion-breadcrumb href="#">
          <ion-img src="assets/icon/svg/icono-casa.svg"></ion-img>
          <ion-label class="label_breadcrumb_01">Inicio</ion-label>
        </ion-breadcrumb>
        <ion-breadcrumb href="#">
          <ion-label class="label_breadcrumb_02">Datos de usuario</ion-label>
        </ion-breadcrumb>
      </ion-breadcrumbs>
    </ion-row>
    <ion-row class="row_content" size="12">
      <ion-col>
        <ion-label class="ion-padding text_label_content">Datos de usuario</ion-label>
      </ion-col>
    </ion-row>
    <ion-row size="12">
      <ion-col size="12">
        <ion-card class="ion-no-padding card_padding">
          <ion-card-content class="ion-no-padding card_content_padding">
            <ion-grid fixed>
              <ion-row class="flex_content">
                <ion-col size="3">
                  <ion-img class="avatarmenu"
                  id="menuImg"
                  [src]="
                    currentUser?.logo !== null
                      ? currentUser?.logo
                      : 'https://api.febelink.com/storage/users/default.png'
                  "
                  (error)="onImgError($event)"
                  alt="Menu profile picture">
                </ion-img>
                </ion-col>
              </ion-row>
              <ion-row class="flex_content margin_05" size="12">
                <ion-col size="10" class="ion-text-center">
                  <ion-label class="text_label_blue">Cambiar foto de perfil</ion-label>
                </ion-col>
              </ion-row>
              <ion-row class="ion-no-margin flex_content" size="12">
                <ion-col size="10" class="ion-text-center">
                  <ion-label class="text_label_grey">Peso máximo de archivo 2MB</ion-label>
                </ion-col>
              </ion-row>
            </ion-grid>
            <ion-grid size="12">
              <ion-row size="12">
                <ion-col size="12">
                  <form *ngIf="form"
                  [formGroup]="form"
                  (ngSubmit)="submitForm()">
                    <ion-item lines="none"> 
                      <ion-label position="stacked" class="text_label_form">Usuario</ion-label>
                      <ion-input formControlName="email" placeholder="Usuario" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Contraseña</ion-label>
                      <ion-input formControlName="password" placeholder="Contraseña" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Repetir contraseña</ion-label>
                      <ion-input formControlName="cambiopass" placeholder="Repetir contraseña" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Sobre mí</ion-label>
                      <ion-textarea formControlName="aboutme" rows="6" cols="20" class="padding-input-12 userform-input" placeholder="Máximo 500 caracteres">
                      </ion-textarea>
                    </ion-item>
                  </form>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-grid fixed>
      <ion-row class="ion-padding paddingf1">
        <ion-button expand class="botonf1" type="submit">Guardar cambios</ion-button>
      </ion-row>
      <ion-row class="ion-padding paddingf2">
        <ion-button expand class="botonf2" type="submit">Cancelar</ion-button>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
