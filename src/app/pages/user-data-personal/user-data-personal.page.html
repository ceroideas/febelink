<ion-header>
  <ion-toolbar class="header_buttons" color="header">
    <ion-buttons buttons-start slot="start">
      <ion-menu-button class="desktop_menu_avatar">
        <ion-img class="avatarmenu"
          id="menuImg"
          [src]="
            currentUser?.logo !== null
              ? currentUser?.logo
              : 'https://api.febelink.com/storage/users/default.png'
          "
          (error)="onImgError($event)"
          alt="Menu profile picture">
        </ion-img>
      </ion-menu-button>  
      <ion-img *ngIf="curUser" class="pos_menu" src="assets/icon/icon_header_menu.png"></ion-img>
      <ion-img *ngIf="curUser" class="mobile menu_header" src="assets/icon/svg/chat_header.svg"></ion-img>
    </ion-buttons>  
    <app-header-buttons class="buttons_flex" [perfil]="curUser" currentTab="6"></app-header-buttons>
    <ion-buttons buttons-start slot="end">
      <ion-img
      tappable 
      src="assets/imgs/logo.png" 
      alt="Febelink logo" 
      (click)="irA('/' + homePage)"
      class="ion-margin logo desktop"></ion-img> 
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-grid class="ion-no-padding" size="12">
    <ion-row size="12" class="row_grid">
      <ion-breadcrumbs mode="ios">
        <ion-breadcrumb href="#">
          <ion-img src="assets/icon/svg/icono-casa.svg"></ion-img>
          <ion-label class="label_breadcrumb_01">Inicio</ion-label>
        </ion-breadcrumb>
        <ion-breadcrumb href="#">
          <ion-label class="label_breadcrumb_02">Datos de usuario</ion-label>
        </ion-breadcrumb>
      </ion-breadcrumbs>
    </ion-row>
    <ion-row class="row_content" size="12">
      <ion-col>
        <ion-label class="ion-padding text_label_content">Datos personales</ion-label>
      </ion-col>
    </ion-row>
    <ion-row size="12">
      <ion-col size="12">
        <ion-card class="ion-no-padding card_padding">
          <ion-card-content class="ion-no-padding card_content_padding">
            <ion-grid size="12">
              <ion-row size="12">
                <ion-col size="12">
                  <form *ngIf="form"
                  [formGroup]="form"
                  (ngSubmit)="submitForm()">
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Nombre y Apellidos</ion-label>
                      <ion-input formControlName="name" placeholder="Nombre y Apellidos" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">DNI/NIF/NIE/CIF</ion-label>
                      <ion-input formControlName="dni" placeholder="DNI/NIF/NIE/CIF" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Nombre de la empresa</ion-label>
                      <ion-input formControlName="empresa" placeholder="Nombre de la empresa" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Dirección</ion-label>
                      <ion-input formControlName="direccion" placeholder="Dirección" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Teléfono</ion-label>
                      <ion-input formControlName="telefono" placeholder="Teléfono" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Web</ion-label>
                      <ion-input formControlName="web" placeholder="Web" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Idioma</ion-label>
                        <ion-select formControlName="idioma" value="Español" multiple="false" placeholder="Idioma">
                          <ion-select-option value="es">Español</ion-select-option>
                          <ion-select-option value="en">Inglés</ion-select-option>
                        </ion-select>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Tarjeta de crédito</ion-label>
                      <ion-input formControlName="tarjeta_credito" placeholder="Tarjeta de crédito" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                    <ion-item lines="none">
                      <ion-label position="stacked" class="text_label_form">Número de cuenta</ion-label>
                      <ion-input formControlName="num_cuenta" placeholder="*************3033" type="text" class="padding-input-12 userform-input"></ion-input>
                    </ion-item>
                  </form>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-grid fixed>
      <ion-row class="ion-padding paddingf1">
        <ion-button expand class="botonf1" type="submit">Guardar cambios</ion-button>
      </ion-row>
      <ion-row class="ion-padding paddingf2">
        <ion-button expand class="botonf2" type="submit">Cancelar</ion-button>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
