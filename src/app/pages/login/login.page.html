<ion-content>
  <div class="cover-content">
    <img src="assets/imgs/logo.png" alt="logo" />
    <div class="slogan">El buscador de servicios profesionales</div>
    <h2 class="title">Iniciar sesión</h2>
    <form
      *ngIf="form"
      [formGroup]="form"
      (ngSubmit)="submitForm()"
      (keyup.enter)="submitForm()"
    >
      <ion-item class="input">
        <ion-label>
          <ion-icon name="person"></ion-icon>
        </ion-label>
        <ion-input
          type="email"
          placeholder="Email"
          formControlName="email"
          required
        ></ion-input>
      </ion-item>
      <ion-item class="input">
        <ion-label>
          <ion-icon name="lock-closed"></ion-icon>
        </ion-label>
        <ion-icon
          slot="end"
          (click)="hideShowPassword()"
          [name]="passwordIcon"
          class="passwordIcon"
        ></ion-icon>
        <ion-input
          (key.enter)="submitForm()"
          [type]="passwordType"
          placeholder="Contraseña"
          formControlName="password"
          required
        ></ion-input>
      </ion-item>
      ¿Olvidaste tu contraseña?<a (click)="openModal()"
        ><i class="fa fa-eye"></i> Recordar ahora</a
      ><br />
      <ion-button
        expand="block"
        type="submit"
        [disabled]="!form.valid"
        ion-button
        color="febelink"
      >
        INICIAR SESIÓN
      </ion-button>
      <social-login [redirect]="redirect"></social-login>
    </form>
    <div class="links">
      <div class="clear"></div>
    </div>
  </div>
  <div class="cover-content newAccountBox">
    <ion-label>¿Nuevo usuario?</ion-label>
    <ion-button color="success" (click)="openRegistro()"
      >Crear cuenta</ion-button
    >
  </div>
  <div class="cover-overlay">
    <a href="mailto:info@febelink.com">Contacta con Febelink</a>
  </div>
</ion-content>
