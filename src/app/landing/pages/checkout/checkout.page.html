<form (ngSubmit)="buy()" [formGroup]="stripeTest">
  <div class="text-center">
    <img class="logo" src="assets/landing/logo-dark.png">
  </div>
  <div class="container card-container">
    <h3 class="text-center mb-3">Pagar con tarjeta</h3>
    <div class="row">
      <div class="field">
        <input id="name" class="input empty" type="text" placeholder="Miguel" required="" formControlName="name">
        <label for="name">Nombre</label>
        <div class="baseline"></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <div id="card-number" class="input empty"></div>
        <label for="card-number" data-tid="elements_examples.form.card_number_label">Card number</label>
        <div class="baseline"></div>
      </div>
    </div>
    <div class="row">
      <div class="field half-width">
        <div id="card-expiry" class="input empty"></div>
        <label for="card-expiry" data-tid="elements_examples.form.card_expiry_label">Expiration</label>
        <div class="baseline"></div>
      </div>
      <div class="field half-width">
        <div id="card-cvc" class="input empty"></div>
        <label for="card-cvc" data-tid="elements_examples.form.card_cvc_label">CVC</label>
        <div class="baseline"></div>
      </div>
    </div>
    <p class="text-danger" style="height: 13px;"> {{error}}</p>
  <button type="submit" data-tid="elements_examples.form.pay_button" class="btn btn-success">Pago de 5€ por {{numTokens}} Febes</button>
  <img class="stripe" src="assets/landing/stripe.svg">
  </div>
</form>
