<form #form="ngForm" (ngSubmit)="getUserData()" style="margin: auto;">
  <h5 class="mb-3 text-center" id="titular-seccion">
    Completa tus datos
  </h5>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">Nombre</ion-label>
          <ion-input type="text" name="name" [(ngModel)]="userData.name" ngDefaultControl ngModel maxlength="200" required></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">Apellidos</ion-label>
          <ion-input type="text" name="lastName" [(ngModel)]="userData.lastName" ngDefaultControl ngModel maxlength="200" required></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>    
    <ion-row>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input type="text" name="email" [(ngModel)]="userData.email" ngDefaultControl ngModel maxlength="100" [disabled]="userData.email"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">DNI (con letra)</ion-label>
          <ion-input type="text" name="dni" [(ngModel)]="userData.dni" ngDefaultControl ngModel maxlength="20"required></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">Provincia</ion-label>
          <ionic-selectable
            item-content
            [(ngModel)]="provincia"
            ngDefaultControl ngModel name="provincia"
            itemValueField="id"
            itemTextField="name"
            [items]="provincias"
            [canSearch]="true"
            (onChange)="provinciasChange($event)"
          >
          </ionic-selectable>
        </ion-item>
      </ion-col>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">Localidad</ion-label>
          <ionic-selectable
            item-content
            [(ngModel)]="localidad"
            ngDefaultControl ngModel name="localidad"
            itemValueField="id"
            itemTextField="name"
            [items]="localidades"
            [canSearch]="true"
            (onChange)="localidadesChange($event)"
          >
          </ionic-selectable>
        </ion-item> 
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">Dirección</ion-label>
          <ion-input type="text" name="address" [(ngModel)]="userData.address" ngDefaultControl ngModel maxlength="200" required></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="12" size-sm="6">
        <ion-item>
          <ion-label position="floating">Teléfono</ion-label>
          <ion-input type="text" name="phone" [(ngModel)]="userData.phone" ngDefaultControl ngModel maxlength="20" required></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" class="mt-3 text-center">
        <button type="submit" class="btn btn-success">
          Confirmar
        </button>
      </ion-col>
    </ion-row>
  </ion-grid>

</form>
