<div class="container-admin">
  <div class="container-img">
    <img src="assets/imgs/img2.png">
  </div>
  <div class="container-panel">
    <div class="grid-options" >
      <div class="item-list" [routerLink]="option.link" *ngFor="let option of options">
        <div class="box-icon">
          <ion-icon slot="start" [name]="option.icon"></ion-icon>
        </div>
        <div class="label">
          <div class="title-item">{{option.title}}</div>
        </div>
        <div class="icon-redirect">
          <i class="fa fa-chevron-right"></i>
        </div>
      </div>
    </div>
  </div>
</div>
