<div 
  *ngIf="loading"
  class="w-full h-full absolute top-0 left-0 flex justify-center items-center"  
>
  <span class="loading loading-ring loading-lg"></span>
</div>

<div role="tablist" class="tabs tabs-boxed font-bold mb-4">
  <a 
    role="tab" 
    class="tab text-black"
    [ngClass]="{ 'bg-primary text-white': activeTab === 'profiles' }"
    (click)="activeTab = 'profiles'"
  >
    Perfiles
  </a>
  <a 
    role="tab" 
    class="tab text-black"
    [ngClass]="{ 'bg-primary text-white': activeTab === 'publications' }"
    (click)="activeTab = 'publications'"
  >
    Publicaciones
  </a>
</div>

<!-- Main list -->
<div *ngIf="!loading" class="flex flex-col gap-4">
  <!-- Statistics -->
  <div class="cards flex flex-wrap gap-4" *ngIf="activeTab === 'profiles'">
    <div class="card w-fit min-w-44 h-fit px-4 py-3 flex flex-col bg-white rounded-lg shadow-default">
      <span class="title mb-2 font-semibold">Clicks</span>
      <span class="data text-4xl font-bold">{{totalProfileClicks}}</span>
      <span class="aux text-neutral-400">Total</span>
    </div>
  </div>
  <div class="cards flex flex-wrap gap-4" *ngIf="activeTab === 'publications'">
    <div class="card w-fit min-w-44 h-fit px-4 py-3 flex flex-col bg-white rounded-lg shadow-default">
      <span class="title mb-2 font-semibold">Clicks</span>
      <span class="data text-4xl font-bold">{{totalPublicationClicks}}</span>
      <span class="aux text-neutral-400">Total</span>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions flex gap-4">
    <!-- Filter -->
    <div class="w-full h-10 bg-white ring-1 ring-inset ring-neutral-200 rounded-lg px-4">
      <input 
        type="text" 
        class="w-full h-full bg-transparent outline-none" 
        placeholder="Filtrar..."
        (input)="filter($event)"
      />
    </div>
  </div>

  <!-- Table profiles -->
  <ul 
    class="bg-white rounded-lg p-3 pb-1 shadow-default"
    *ngIf="activeTab === 'profiles'"
  >
    <!-- Header -->
    <li class="sticky top-1 flex items-center gap-2 p-1 px-3 bg-neutral-100 rounded font-semibold">
      <span class="w-full h-fit">Perfil</span>
      <span class="w-32 h-fit shrink-0 text-right">Clicks</span>
      <span class="w-20 h-fit shrink-0 text-right">Acciones</span>
    </li>

    <!-- Data -->
    <li 
      class="flex items-center gap-2 p-1 py-2 pr-3 border-b last:border-none cursor-pointer"
      *ngFor="let item of filteredProfiles"
    >
      <!-- Title -->
      <span class="w-full h-fit">{{ item.nick }}</span>
      <!-- Keywords -->
      <span 
        class="w-32 shrink-0 text-right disabled:opacity-50" 
      >
        <span 
          class="rounded-full px-2 py-1 pt-1 text-xs font-medium ring-1 ring-inset bg-green-50 text-green-700 ring-green-600/20 shrink-0"
        >
          {{item.numProfile}}
        </span>
      </span>
      <!-- Actions -->
      <div class="buttons w-20 flex gap-2 justify-end items-center shrink-0">
        <!-- Edit -->
        <button 
          class="w-7 h-7 flex justify-center items-center"
          (click)="showProfile(item)"
        >
          <lucide-icon 
            name="eye"
            class="stroke-gray-500 stroke-link transition duration-75 group-hover:stroke-gray-900" 
            [size]="20"
          />
        </button>
      </div>
    </li>
  </ul>

  <!-- Table publications -->
  <ul 
    class="bg-white rounded-lg p-3 pb-1 shadow-default"
    *ngIf="activeTab === 'publications'"
  >
    <!-- Header -->
    <li class="sticky top-1 flex items-center gap-2 p-1 px-3 bg-neutral-100 rounded font-semibold">
      <span class="w-full h-fit">Publicación</span>
      <span class="w-32 h-fit shrink-0 text-right">Clicks</span>
      <span class="w-20 h-fit shrink-0 text-right">Acciones</span>
    </li>

    <!-- Data -->
    <li 
      class="flex items-center gap-2 p-1 py-2 pr-3 border-b last:border-none cursor-pointer"
      *ngFor="let item of filteredPublications"
    >
      <!-- Title -->
      <span class="w-full h-fit">{{ item.title }}</span>
      <!-- Keywords -->
      <span 
        class="w-32 shrink-0 text-right disabled:opacity-50" 
      >
        <span 
          class="rounded-full px-2 py-1 pt-1 text-xs font-medium ring-1 ring-inset bg-green-50 text-green-700 ring-green-600/20 shrink-0"
        >
          {{item.numPublication}}
        </span>
      </span>
      <!-- Actions -->
      <div class="buttons w-20 flex gap-2 justify-end items-center shrink-0">
        <!-- Edit -->
        <button 
          class="w-7 h-7 flex justify-center items-center"
          (click)="showPublication(item)"
        >
          <lucide-icon 
            name="eye"
            class="stroke-gray-500 stroke-link transition duration-75 group-hover:stroke-gray-900" 
            [size]="20"
          />
        </button>
      </div>
    </li>
  </ul>
</div>
