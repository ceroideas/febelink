<ion-content id="search-content" class="content-background">
  <ion-grid class="ion-no-padding">
    <ion-row>
      <ion-col size="12">
        <ion-row size="12">
          <ion-col size="12">
            <img class="tam_imagen" style="width: 100%" *ngIf="searchService.show_imagen"
                 src="assets/imgs/buscador_fondo.png"/>
          </ion-col>
        </ion-row>
        <ion-row class="row_buscador">
          <ion-col size="12">
            <ion-row class="ion-padding" class="service-bar">
              <ion-button (click)="navigateNewServices()" expand="block" class="service-button">Ofrece tus servicios
              </ion-button>
              <ion-label *ngIf="searchService.show_imagen"
                         class="text_buscador">{{ 'tabs.tab1.search.search_prof' | translate }}</ion-label>
            </ion-row>
            <ion-row size="12">

              <app-search
                  #search
                  class="app_search"
                  clase="autocomplete"
                  *ngIf="!isLoading"
              ></app-search>
            </ion-row>
          </ion-col>
        </ion-row>

        <ion-row *ngIf="isLoading">
          <ion-spinner></ion-spinner>
          <ion-text>{{ 'common.labelLoading' | translate }}</ion-text>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-grid>
  <app-footer></app-footer>
</ion-content>
