<ion-header>
  <ion-toolbar color="light">
    <ion-buttons buttons-start slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <app-header-buttons [perfil]="perfil" currentTab="1"></app-header-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-grid class="ion-no-padding">
    <ion-row>
      <ion-col size="12">

        <ion-img src="assets/imgs/buscador_fondo.png"></ion-img>

        <ion-row class="row_buscador">
          <ion-col size="">
            <ion-row class="ion-padding">
              <ion-text class="text_buscador">Encuentra profesionales de confianza</ion-text>
            </ion-row>
            <ion-row>
              <app-search
              #search
              class="app_search"
              clase="autocomplete"
              *ngIf="!isLoading"
            ></app-search>
            </ion-row>
          </ion-col>
        </ion-row>

        <ion-row *ngIf="isLoading">
          <ion-spinner></ion-spinner>
          <ion-text>{{ 'common.labelLoading' | translate }}</ion-text>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
<app-footer></app-footer>
