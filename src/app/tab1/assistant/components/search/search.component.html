<ion-grid [class]="'no-pad ' + (clase || '')">
  <!-- SearchBar -->
  <div style="width:100%;">
    <ion-row *ngIf="showSearchbar" size="12">
      <ion-col size="6">
        <!-- (ionBlur)="assistantSearchSvc.removeFocus()" -->
        <ion-searchbar style="margin-left: 40%;"
          class="searchbar"
          placeholder="{{ 'common.publishPlaceholder' | translate }}"
          [(ngModel)]="searchText"
          (ionFocus)="assistantSearchSvc.addFocus()"
          (ionChange)="assistantSearchSvc.search(searchText)"
          (ionClear)="assistantSearchSvc.clearBtn()"
          (keyup.enter)="OnEnterPress($event)"
          debounce="500"
        ></ion-searchbar>
      </ion-col>
    </ion-row>
  </div>
  <!-- Loading -->
  <!-- <app-loading [isLoading]="assistantSearchSvc.isLoading"></app-loading> -->

  <!-- Item Options -->
  <div class="keys-dropdown">
    <ion-list
      mode="ios"
      *ngIf="searchText.length > 2 && assistantSearchSvc.hasKeys()"
    >
      <ion-item
        (click)="assistantSearchSvc.getSectorsByKeys(key)"
        *ngFor="let key of assistantSearchSvc.keys()"
        class="pointer"
        style="font-size: 16px"
      >
        <ion-icon slot="start" name="search-outline"></ion-icon>
        <span
          *ngIf="key.level"
          [innerHTML]="
            key.level === 'sector'
              ? 'Sector -&nbsp;'
              : key.level === 'subsector'
              ? 'Subsector -&nbsp;'
              : ''
          "
        ></span>
        <span [innerHTML]="key.name"></span>
      </ion-item>
    </ion-list>
  </div>
</ion-grid>
