<ion-card class="no-margin">
  <quill-editor
    trackChanges="all"
    [modules]="modules"
    [ngModel]="content?.html || ''"
    [placeholder]="placeholder"
    (onEditorCreated)="created($event)"
    
    [styles]="styles" 
    [readOnly]="readOnly"
     
    (onFocus)="focus($event)" 
    (onEditorChanged)="changedEditor($event)"
    (onBlur)="blur($event)"
    ngDefaultControl
  ></quill-editor>
  <!-- <pre><code>{{ content?.html }}</code></pre>
  <ion-label [innerHTML]="content?.html"></ion-label> -->
</ion-card>
