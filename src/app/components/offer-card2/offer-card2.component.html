<div class="bg-white p-3 pt-1.5 rounded-xl shadow-xl">
  <a [href]="'/servicio/' + toSlug(offer?.title) + '/detail/' + offer?.productId">
    <h3 class="font-bold text-base mb-1 text-neutral-900">{{offer.title}}</h3>

    <div class="flex gap-4">
      <div class="w-28 h-28 shrink-0">
        <img class="aspect-square object-cover rounded" [src]="urlWsrv + offer.images[0] +'&w=800&output=webp'"/>
      </div>

      <div class="flex flex-col flex-1 justify-between"> 
        <div class="line-clamp-4 text-sm text-neutral-600" style="word-break: break-word;" [innerHtml]="offer.description"></div>
        <div class="text-right text-sm text-neutral-500 font-semibold">Mostrar <i class="fa fa-chevron-right ml-1 text-link text-xs"></i>
        </div>
      </div>
    </div>
  </a>
</div>
