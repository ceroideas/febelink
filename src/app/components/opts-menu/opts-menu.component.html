<!-- Title -->
<ion-item><ion-title *ngIf="title">{{ title | translate }}</ion-title></ion-item>

<ion-item *ngFor="let btn of buttons" (click)="btn?.click( btn )">
  <ion-icon [name]="btn?.icon" *ngIf="btn.icon"></ion-icon>
  <ion-img *ngIf="btn?.img" [src]="btn?.img"
    appImgErrorFallback="https://api.febelink.com/storage/users/default.png"
  ></ion-img>
  <ion-label>{{ btn?.text | translate }}</ion-label>
</ion-item>
