<ion-footer class="ion-no-border ion-text-center desktop">
<section>
  <ion-grid>
  <ion-row>
    <ion-col size="4">
      <ion-img 
        tappable 
        src="assets/imgs/logo.png" 
        alt="Febelink logo" 
        (click)="irA('/' + homePage)"
        class="ion-margin logo">
      </ion-img>
    </ion-col>
    <ion-col size="8">
      <ion-grid>
        <ion-row class="lista_footer">
            <ion-col size="3">
              <ion-list>
                <ion-item lines="none">
                  <ion-label color="texto-bold-footer">COMPANY</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">About</ion-label>
                </ion-item> 
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Premium</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Blog</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Affiliate Program</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Get Coupon</ion-label>
                </ion-item>
              </ion-list>
            </ion-col>
            <ion-col size="3">
              <ion-list>
                <ion-item lines="none">
                  <ion-label color="texto-bold-footer">HELP AND SUPPORT</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Contact Us</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Knowgledge Center</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Premium Support</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Knowgledge Center</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-label color="texto-gray-footer">Sponsorships</ion-label>
                </ion-item>
              </ion-list>
            </ion-col>
            <ion-col size="3">
              <ion-list>
              <ion-item class="ion-no-padding" lines="none">
                <ion-label color="texto-bold-footer">LEGAL</ion-label>
              </ion-item>
              <ion-item (click)="openLegalDisclaimer()" class="ion-no-padding" lines="none">
                <ion-label color="texto-gray-footer">Privacy Policy</ion-label>
              </ion-item>
              <ion-item (click)="termsModal()" class="ion-no-padding" lines="none">
                <ion-label color="texto-gray-footer">Terms & Conditions</ion-label>
              </ion-item>
              <ion-item class="ion-no-padding" lines="none">
                <ion-label color="texto-gray-footer">Eula</ion-label>
              </ion-item>
            </ion-list>
            </ion-col>
        </ion-row>
      </ion-grid>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col size="8">
      <ion-item lines="none">
        <ion-label color="texto-gray-footer" class="ion-text-right ion-padding">
          © {{ currentYear }} | FebeLink. All rights reserved.
        </ion-label>
      </ion-item>
    </ion-col>
    <ion-col size="4">
      <ion-item lines="none">
        <ion-label class="ion-text-right ion-padding">
          <app-lang-btn color="texto-gray-footer"></app-lang-btn>
        </ion-label>
      </ion-item>
    </ion-col>
  </ion-row>
</ion-grid>
</section>
</ion-footer>
