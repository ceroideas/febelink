<ion-header>
  <ion-toolbar color="febelink">
    <ion-title> {{ 'common.verif.email.head' | translate }} </ion-title>
    <ion-buttons slot="end">
      <ion-button slot="icon-only" (click)="closeModal()"> 
        <ion-icon style="font-size: x-large;" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">

  <p class="ion-text-justify" [innerHTML]="'common.verif.email.title' | translate | safeHtml"></p>

  <ion-label class="ion-text-justify"> {{ 'common.verif.email.pompadour' | translate }} </ion-label>
  <strong> {{ email }} </strong>

  <br>

  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-button id="btnSave" expand="block" (click)="submit()">
          {{ 'common.verif.buttons.now' | translate }}
        </ion-button>
      </ion-col>

      <ion-col size="6" *ngIf="which == verifWhich.Save">
        <ion-button id="btnDismiss" expand="block" (click)="closeModal()">
          {{ 'common.verif.buttons.not-now' | translate }}
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
