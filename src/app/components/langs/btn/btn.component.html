<ion-button class="desktop btn_idioma" size="small"  fill="clear" (click)="selectLang( $event )" >
  <img *ngIf="langSelected" slot="start" density="ldpi" src="assets/icon-flags/{{langSelected?.flag}}.png" width="30px" height="30px"/>
  <ion-label class="desktop idiomaMin">{{ langSelected?.language }}</ion-label><ion-label class="desktop idiomaMay">({{langSelected?.country}})</ion-label>
  <ion-img class="desktop icono_idioma" src="assets/icon-flags/flecha_idioma.svg"></ion-img>
</ion-button>
