<div *ngIf="short" (click)="selectLang( $event )" class="button-lang">
  <div class="button-lang-text">
    {{langSelected?.country}}
  </div>
  <img src="assets/icon/svg/chevron-down.svg" class="button-lang-svg" />
</div>

<div *ngIf="!short" (click)="selectLang( $event )" class="button-lang button-full">
  <div *ngIf="langSelected?.country" class="button-lang-text lang-cell">
    {{langSelected?.country}}
  </div>
  <div *ngIf="!langSelected?.country" class="button-lang-text lang-cell">
    Idioma
  </div>
  <div class="lang-cell-b">
    <img src="assets/icon/svg/chevron-down.svg" class="button-lang-svg" />
  </div>
</div>
