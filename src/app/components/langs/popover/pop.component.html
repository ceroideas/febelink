<ion-list>
  <ion-item *ngFor="let lang of langs; let i = index;" detail (click)="onLangSelected( lang )" style="cursor: pointer;">
    <img slot="start" density="ldpi" src="assets/icon-flags/{{lang.flag}}.png" width="30px" height="30px"/>
    <ion-label>{{ lang.lang }}</ion-label>
  </ion-item>
</ion-list>
