<ion-grid>
  <ion-row>
    <!-- Sector -->
    <ion-col class="ion-no-padding pad-e5" size-lg="6" size-md="6" size-sm="12" size-xs="12">
      <app-loading [isLoading]="sectors?.length <= 0" message="common.labelSector"></app-loading>
      <ion-item class="input" *ngIf="sectors?.length > 0">
        <!-- Label -->
        <ion-label position="floating">{{ 'common.labelSector' | translate }}</ion-label>
        <!-- Select -->
        <ion-select
          clearInput
          type="text"
          formControlName="sector"
          (ionChange)="onChangeSector($event)"
        >
          <ion-select-option
            *ngFor="let s of sectors"
            [value]="s?.id"
            >{{s?.nombre}}</ion-select-option
          >
        </ion-select>
      </ion-item>
    </ion-col>

    <!-- Subsector -->
    <ion-col class="ion-no-padding" size-lg="6" size-md="6" size-sm="12" size-xs="12">
      <app-loading [isLoading]="subsectors?.length <= 0" message="common.labelSubsector"></app-loading>
      <ion-item class="input" *ngIf="subsectors?.length>0">
        <!-- Label -->
        <ion-label position="floating">{{ 'common.labelSubsector' | translate }}</ion-label>
        <!-- Select -->
        <ion-select clearInput type="text" formControlName="subsector">
          <ion-select-option
            *ngFor="let subsector of subsectors"
            [value]="subsector?.id"
          >{{subsector?.nombre}}</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-col>
  </ion-row>
</ion-grid>
