<form [class]="classWH + 'marg-se fmMedia ' + (classes || '')">
  <!-- To Pick Files on Browsers -->
  <input
    #filePicker
    type="file"
    [accept]="pickType"
    (change)="pickMedia(filePicker)"
    enctype="multipart/form-data"
  />

  <!-- Image -->
  <ng-container
    *ngIf="
      iFile?.src &&
      (iFile?.format == pickTypes.IMAGE || mediaSvc.isImage(iFile?.ext))
    "
  >
    <!-- Ion Img -->
    <ion-img
      [style]="styles || ''"
      [src]="iFile.src || fallback"
      *ngIf="elType == elTypes.ION_IMG"
      [appImgErrorFallback]="fallback"
      [class]="classWH + (classes || '')"
      (click)="filePicker.click()"
    ></ion-img>

    <!-- IMG -->
    <img
      [style]="styles || ''"
      [src]="iFile.src"
      *ngIf="elType == elTypes.IMG"
      [appImgErrorFallback]="fallback"
      [class]="classWH + (classes || '')"
      (click)="filePicker.click()"
    />

    <!-- Ion Avatar -->
    <ion-avatar *ngIf="elType == elTypes.AVATAR">
      <ion-img
        [style]="styles || ''"
        [src]="iFile.src"
        [appImgErrorFallback]="fallback"
        [class]="classWH + (classes || '')"
        (click)="filePicker.click()"
      ></ion-img>
    </ion-avatar>
  </ng-container>

  <!-- Video -->
  <video
    playsinline
    controls
    *ngIf="
      iFile?.src &&
      (iFile?.format == pickTypes.VIDEO || mediaSvc.isVideo(iFile?.ext))
    "
    [class]="classWH + 'media-video'"
    preload="metadata"
  >
    <source
      [src]="domSanitizer.bypassSecurityTrustUrl(iFile?.src)"
      type="video/mp4"
    />
  </video>
</form>
