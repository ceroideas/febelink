<ion-item
    tappable
    lines="none"
    (click)="userClick()"
>
    <ion-avatar slot="start">
        <img src="https://api.febelink.com/storage/users/default.png" *ngIf="!user?.logo" />
        <ion-img
            [src]="user?.logo"
            *ngIf="user?.logo"
            appImgErrorFallback="https://api.febelink.com/storage/users/default.png"
        ></ion-img>
    </ion-avatar>
    <ion-label>
        {{ user?.name || user?.nick }} {{ user?.lastName }}
    </ion-label>
</ion-item>
