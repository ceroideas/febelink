<ion-app>
  <!--
    <app-menu></app-menu>
    <ion-router-outlet id="main"></ion-router-outlet>
  -->
  <ion-split-pane contentId="main-content" [when]="platform.width() >= 992 && authenticationService.isAuthenticated()">
    <ion-menu *ngIf="authenticationService.isAuthenticated()" contentId="main-content" type="overlay">
        <ion-header>
            <ion-toolbar color="primary">
                <ion-title>Menu</ion-title>
                <ion-buttons slot="end">
                    <ion-button (click)="logout()">
                        <ion-icon slot="icon-only" name="log-out"></ion-icon>
                    </ion-button>
                </ion-buttons>
            </ion-toolbar>
            <ion-toolbar color="primary">
                <ion-item color="primary">
                    <ion-avatar slot="start">
                    <img src="assets/guide/user2.png" alt="Menu profile picture">
                    </ion-avatar>
                    <ion-label class="ion-text-wrap">
                        <h2> User </h2>
                    </ion-label>
                </ion-item>
                    <ion-buttons slot="end">
                        <ion-button routerLink="/menu/perfil">
                            <ion-icon slot="icon-only" color="light" name="create"></ion-icon>
                        </ion-button>
                    </ion-buttons>
            </ion-toolbar>
        </ion-header>
        <ion-content>
            <ion-list id="inbox-list">
                <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
                    <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                        <div tabindex="0"></div>
                        <ion-icon slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                        <ion-label>{{ 'menu.pages.' + p.key | translate }}</ion-label>
                    </ion-item>
                </ion-menu-toggle>
            </ion-list>

        </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-split-pane>
</ion-app>
