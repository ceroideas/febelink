<ion-tabs>
  <ion-tab-bar slot="bottom" color="febelink">
    <ion-tab-button tab="todas">
      <ion-icon name="search"></ion-icon>
      <ion-label>{{ 'menu.tabs.searchEngine' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="busquedas">
      <ion-icon name="archive"></ion-icon>
      <ion-label>{{ 'menu.tabs.recommend' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="ofertas">
      <ion-icon name="hand-right"></ion-icon>
      <ion-label>{{ 'menu.tabs.chat' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button *ngIf="perfil === null" (click)="irA('perfil')">
      <ion-icon name="person"></ion-icon>
      <ion-label>{{ (perfil !== null ? 'menu.tabs.profile' : 'menu.tabs.login') | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
