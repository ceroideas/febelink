<ion-tabs>

  <ion-tab-bar slot="bottom" color="febelink">
    <ion-tab-button tab="tab1">
      <ion-icon name="search"></ion-icon>
      <ion-label>Todas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2">
      <ion-icon name="archive"></ion-icon>
      <ion-label>Búsquedas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3">
      <ion-icon name="hand-right"></ion-icon>
      <ion-label>Ofertas</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="irA('perfil')">
      <ion-icon name="person"></ion-icon>
      <ion-label>{{ perfil !== null ? 'Perfil' : 'Inciar sesión'}}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
